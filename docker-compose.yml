version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ncmrwf_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
      POSTGRES_DB: forecast_bust_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ncmrwf_backend
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/forecast_bust_db
      - OPEN_METEO_ENABLED=true
      - DEMO_MODE=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ncmrwf_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_dev_password@postgres:5432/forecast_bust_db
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
