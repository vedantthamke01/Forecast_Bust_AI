name: Build Android Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/flutter_app/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd apps/flutter_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd apps/flutter_app
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: forecast-bust-ai-release-apk
          path: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.1
          name: Forecast Bust AI v1.0.1 (Production Cloud)
          body: |
            ### Forecast Bust AI - Android Release v1.0.1
            Pre-configured with live Render cloud backend:
            `https://forecast-bust-ai.onrender.com`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
